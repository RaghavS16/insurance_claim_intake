services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_claims}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance_claims"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.3
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-turn.invalid}
      - --user=${TURN_USERNAME:-invalid}:${TURN_PASSWORD:-invalid}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49252
      - --no-multicast-peers
      - --no-loopback-peers
    healthcheck:
      test: ["CMD-SHELL", "turnutils_uclient -t -u ${TURN_USERNAME} -w ${TURN_PASSWORD} 127.0.0.1 3478 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1

  piper:
    build: ./infra/voice/piper
    restart: unless-stopped
    environment:
      HOME: /tmp
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/info', timeout=3).read(1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  migrate:
    build: ./backend
    restart: "no"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insurance_claims}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      FASTEMBED_CACHE_DIR: /tmp/fastembed_cache
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insurance_claims}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      REQUIRE_MALWARE_SCAN: ${REQUIRE_MALWARE_SCAN:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      FAST_LLM_PROVIDER: ${FAST_LLM_PROVIDER:-huggingface}
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-openai/gpt-oss-20b:groq}
      REASONING_LLM_PROVIDER: ${REASONING_LLM_PROVIDER:-huggingface}
      REASONING_LLM_MODEL: ${REASONING_LLM_MODEL:-openai/gpt-oss-120b:groq}
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      FAST_LLM_TIMEOUT_SECONDS: ${FAST_LLM_TIMEOUT_SECONDS:-8}
      REASONING_LLM_TIMEOUT_SECONDS: ${REASONING_LLM_TIMEOUT_SECONDS:-20}
      FAST_LLM_RETRY_ATTEMPTS: ${FAST_LLM_RETRY_ATTEMPTS:-1}
      REASONING_LLM_RETRY_ATTEMPTS: ${REASONING_LLM_RETRY_ATTEMPTS:-1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
      LLM_RETRY_ATTEMPTS: ${LLM_RETRY_ATTEMPTS:-1}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-0.25}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KNOWLEDGE_PREFIX: ${S3_KNOWLEDGE_PREFIX:-knowledge}
      S3_EVIDENCE_PREFIX: ${S3_EVIDENCE_PREFIX:-claims}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      VAD_AGGRESSIVENESS: ${VAD_AGGRESSIVENESS:-1}
      VOICE_ICE_SERVERS: ${VOICE_ICE_SERVERS:?Set VOICE_ICE_SERVERS_with_TURN}
      VOICE_TTS_BASE_URL: ${VOICE_TTS_BASE_URL:-http://piper:5001/synthesize}
      VOICE_EVENT_RETENTION_SECONDS: ${VOICE_EVENT_RETENTION_SECONDS:-86400}
      VOICE_WORKER_ID: ${VOICE_WORKER_ID:-backend-1}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:?Set_AI_ALLOWED_MODELS}
      AI_ALLOW_LOCAL_FALLBACK: ${AI_ALLOW_LOCAL_FALLBACK:-false}
      PASSKEY_ENABLED: ${PASSKEY_ENABLED:-true}
      PRIVILEGED_PASSKEY_REQUIRED: ${PRIVILEGED_PASSKEY_REQUIRED:-true}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?Set_PASSKEY_RP_ID}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:?Set_PASSKEY_ORIGIN_HTTPS}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      VOICE_TURN_SILENCE_SECONDS: ${VOICE_TURN_SILENCE_SECONDS:-0.55}
      VOICE_MAX_QUEUED_TURNS: ${VOICE_MAX_QUEUED_TURNS:-1}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mailpit}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@insurance-claims.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-InsureClaim AI}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      piper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  outbox-worker:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-insurance_claims}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set_REDIS_PASSWORD}@redis:6379/0
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      REQUIRE_S3_IN_PRODUCTION: ${REQUIRE_S3_IN_PRODUCTION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@insurance-claims.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-InsureClaim AI}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
    command: ["python", "-m", "src.services.outbox_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
