# =============================================================================
# Local Development Override for Docker Compose
# Usage: docker compose -f docker-compose.dev.yml up -d --build
# =============================================================================

include:
  - docker-compose.yml

services:
  mailpit:
    profiles: [] # Active by default in dev

  migrate:
    environment:
      ENVIRONMENT: development
      DEBUG: "true"

  backend:
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      REQUIRE_REDIS_IN_PRODUCTION: "false"
      REQUIRE_S3_IN_PRODUCTION: "false"
      REQUIRE_MALWARE_SCAN: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      REQUIRE_MIGRATIONS_IN_PRODUCTION: "false"
      EMAIL_BACKEND: mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: dev@insurance-claims.local
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      PUBLIC_APP_URL: http://localhost:3000
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      REQUIRE_TURN_IN_PRODUCTION: "false"

  outbox-worker:
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      REQUIRE_S3_IN_PRODUCTION: "false"
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      EMBEDDING_DIMENSION: "768"
      EMAIL_BACKEND: mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: dev@insurance-claims.local
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
