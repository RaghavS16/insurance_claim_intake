name: Supply Chain Security

on:
  push:
    branches: [release/production-ready, production-grade-UI-UX, main]
  pull_request:
    branches: [release/production-ready, production-grade-UI-UX, main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  sbom-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backend image
        run: docker build --pull -t insurance-claim-intake:${{ github.sha }} ./backend
      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.9
        with:
          image: insurance-claim-intake:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: insurance-claim-intake:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Enforce high and critical findings
        run: |
          test -f trivy.sarif
          findings=$(jq '[.runs[].results[]?] | length' trivy.sarif)
          echo "High/Critical findings: ${findings}"
          test "${findings}" -eq 0
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: trivy.sarif
      - name: Upload SBOM
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json