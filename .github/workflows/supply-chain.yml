name: Supply Chain Security

on:
  push:
    branches: [production-grade-hardening-2026-10, production-grade-UI-UX]
  pull_request:
    branches: [production-grade-hardening-2026-10, production-grade-UI-UX]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  sbom-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t insurance-claim-intake:${{ github.sha }} ./backend
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: insurance-claim-intake:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: insurance-claim-intake:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Enforce high and critical findings
        run: |
          test -f trivy.sarif
          findings=$(jq '[.runs[].results[]?] | length' trivy.sarif)
          echo "High/Critical findings: ${findings}"
          test "${findings}" -eq 0
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json