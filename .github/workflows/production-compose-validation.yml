name: Production Compose Validation

on:
  push:
    branches: ["**"]
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/production-compose-validation.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/production-compose-validation.yml"

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production compose interpolation
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_PASSWORD=test-postgres-password
          REDIS_PASSWORD=test-redis-password
          SECRET_KEY=test-secret-key-at-least-32-characters-long
          HF_TOKEN=test-token
          VOICE_ICE_SERVERS=turn:turn.example.invalid:3478
          AI_ALLOWED_MODELS=test-model
          S3_BUCKET=test-bucket
          S3_KMS_KEY_ID=test-kms-key
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_USERNAME=test
          SMTP_PASSWORD=test
          SMTP_FROM_EMAIL=noreply@example.com
          SMTP_USE_TLS=false
          SMTP_USE_SSL=false
          EMAIL_BACKEND=smtp
          FORWARDED_ALLOW_IPS=127.0.0.1,172.16.0.0/12,10.0.0.0/8
          ALLOWED_ORIGINS=http://localhost:3000
          PUBLIC_APP_URL=http://localhost:3000
          DEMO_PASSWORD=ci-demo-password-123!
          ADMIN_PASSWORD=ci-admin-password-123!
          DOMAIN=localhost
          EOF
          docker compose --env-file .env.ci config --quiet
          echo "docker compose configuration is valid"
