name: Full Stack Runtime Smoke

on:
  push:
    branches: ["**"]
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/full-stack-smoke.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/full-stack-smoke.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create CI production environment
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=insurance_claims
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          SECRET_KEY=ci-secret-key-012345678901234567890123456789
          ENVIRONMENT=production
          DEBUG=false
          ENABLE_API_DOCS=true
          HF_TOKEN=ci-token
          AI_ALLOWED_MODELS=ci-test-model
          VOICE_ICE_SERVERS=turn:turn.example.invalid:3478
          PUBLIC_APP_URL=http://localhost:3000
          S3_BUCKET=ci-test-bucket
          S3_KMS_KEY_ID=ci-test-kms-key
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_USERNAME=ci
          SMTP_PASSWORD=ci
          SMTP_FROM_EMAIL=noreply@example.com
          SMTP_USE_TLS=false
          SMTP_USE_SSL=false
          EMAIL_BACKEND=smtp
          FORWARDED_ALLOW_IPS=127.0.0.1,172.16.0.0/12,10.0.0.0/8
          REQUIRE_EMAIL_VERIFICATION=false
          REQUIRE_MALWARE_SCAN=false
          REQUIRE_S3_IN_PRODUCTION=false
          DEMO_PASSWORD=ci-demo-password-123!
          ADMIN_PASSWORD=ci-admin-password-123!
          ADMIN_EMAIL=admin@example.com
          ADMIN_FULL_NAME="CI Administrator"
          DOMAIN=localhost
          EOF

      - name: Build and start dependencies
        run: |
          docker compose --env-file .env.ci up -d --build postgres redis clamav migrate

      - name: Start backend with diagnostics
        run: |
          docker compose --env-file .env.ci up -d --build backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          docker compose --env-file .env.ci ps
          docker compose --env-file .env.ci logs --tail=300 backend migrate
          exit 1

      - name: Start frontend
        run: |
          docker compose --env-file .env.ci up -d --build frontend

      - name: Verify frontend serves SPA
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ | grep -Eq '<html|__next_f'; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.ci ps
          docker compose --env-file .env.ci logs --tail=200 frontend
          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          DEMO_PASSWORD: ci-demo-password-123!
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.ci down -v
