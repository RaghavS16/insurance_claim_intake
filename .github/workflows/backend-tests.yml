name: Backend Production Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: insurance_claims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance_claims"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DEBUG: "true"
      SECRET_KEY: test-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql://postgres:test@localhost:5432/insurance_claims
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src
      - name: Migration upgrade from empty database
        run: alembic upgrade head
      - name: Migration idempotency
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
